version: "3.9"

services:
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:4000"
    environment:
      - PORT=4000
      - INVENTORY_URL=http://inventory-service:4001
      - WAREHOUSE_URL=http://warehouse-service:4002
    depends_on:
      - inventory-service
      - warehouse-service
    networks: [swaivp-net]

  inventory-service:
    build: ./services/inventory-service
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [swaivp-net]

  warehouse-service:
    build: ./services/warehouse-service
    environment:
      - PORT=4002
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [swaivp-net]

  notification-service:
    build: ./services/notification-service
    environment:
      - PORT=4003
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [swaivp-net]

  iot-ingestion-service:
    build: ./services/iot-ingestion-service
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [swaivp-net]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks: [swaivp-net]

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [swaivp-net]

  redis:
    image: redis:7-alpine
    networks: [swaivp-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [swaivp-net]

volumes:
  pgdata:

networks:
  swaivp-net:
    driver: bridge
